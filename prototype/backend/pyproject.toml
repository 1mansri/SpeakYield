[project]
name = "speak-yield-backend"
version = "0.1.0"
description = "Speak Yield prototype backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # app/config.py loads .env directly, so this is a first-class dependency rather than
    # something we inherit by luck from uvicorn[standard].
    "python-dotenv>=1.0",
]

[tool.uv]
# Don't build/install this backend as a package. `uv run` otherwise builds a wheel in an
# isolated env under uv's cache, and Windows Application Control blocks executing that
# copied python.exe (os error 4551). Nothing needs the wheel: the app is imported from the
# working directory both locally and in the container (WORKDIR /app).
package = false

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's File()/Depends()/Query() as defaults is the idiomatic pattern

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
